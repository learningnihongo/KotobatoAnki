name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0, leave empty for auto-version)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Version
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            # Extract versionName from app/build.gradle.kts (e.g. 1.0)
            VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
            if [ -z "$VERSION_NAME" ]; then
              VERSION_NAME="1.0"
            fi
            TAG="v${VERSION_NAME}.${{ github.run_number }}"
          fi

          echo "Determined Release Version: $TAG"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Setup Environment File
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding provided release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            echo "Generating build keystore..."
            keytool -genkey -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ secrets.STORE_PASSWORD || 'android' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'android' }}" \
              -dname "CN=AnkiFlashcards, OU=App, O=AIStudio, C=MM"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK File for Release
        run: |
          mkdir -p release-apks
          ORIG_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -f "$ORIG_APK" ]; then
            TARGET_APK="release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}.apk"
            cp "$ORIG_APK" "$TARGET_APK"
            echo "Release APK successfully copied to: $TARGET_APK"
            ls -lh release-apks/
          else
            echo "Error: No release APK found in app/build/outputs/apk/release/"
            exit 1
          fi

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnkiFlashcards-${{ env.RELEASE_TAG }}
          path: release-apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: release-apks/*.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
