name: Build & Release Android APK

on:
  push:
    branches:
      - 'main'
      - 'master'
      - '**'
    tags:
      - 'v*'
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Version (e.g. v1.0.0, or leave empty for auto-version)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Gradlew Permissions & Line Endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Determine Version Tag
        id: versioning
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
            if [ -z "$VERSION_NAME" ]; then
              VERSION_NAME="1.0"
            fi
            TAG="v${VERSION_NAME}.${{ github.run_number }}"
          fi

          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "=========================================="
          echo "Target Release Tag: $TAG"
          echo "=========================================="

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK Environment & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK path: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV

          if [ -d "$SDK_DIR" ]; then
            sudo mkdir -p "$SDK_DIR/licenses" 2>/dev/null || true
            sudo chmod -R 777 "$SDK_DIR/licenses" 2>/dev/null || true
            printf "\n89336d0b3d7730a4e8313b618456e6dcbda44770\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" | sudo tee "$SDK_DIR/licenses/android-sdk-license" >/dev/null || true
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" | sudo tee "$SDK_DIR/licenses/android-sdk-preview-license" >/dev/null || true
            printf "\n7907f48b99f5e377b213031a7e49f8b1353acb63\n" | sudo tee "$SDK_DIR/licenses/android-sdk-arm-dbt-license" >/dev/null || true
          fi

          # Create local repositories config
          mkdir -p "$HOME/.android" || true
          touch "$HOME/.android/repositories.cfg"

          # Attempt to accept all licenses with sdkmanager if available
          for sdkman in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/13.0/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/11.0/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/bin/sdkmanager" \
            "$SDK_DIR/tools/bin/sdkmanager"; do
            if [ -x "$sdkman" ]; then
              echo "Found sdkmanager at: $sdkman"
              yes | "$sdkman" --licenses 2>/dev/null || true
              break
            fi
          done

      - name: Prepare Config Files (.env & google-services.json)
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          touch .env

          # Create placeholder google-services.json if missing to satisfy Google Services plugin
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "anki-flashcards-app",
              "storage_bucket": "anki-flashcards-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.ankiflashcards.rvkptx"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_api_key" }],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Setup Signing Keystores
        run: |
          STORE_PWD="${{ secrets.STORE_PASSWORD }}"
          [ -z "$STORE_PWD" ] && STORE_PWD="android"

          KEY_PWD="${{ secrets.KEY_PASSWORD }}"
          [ -z "$KEY_PWD" ] && KEY_PWD="android"

          # 1. Setup debug.keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore app/debug.keystore 2>/dev/null || true

          # 2. Setup my-upload-key.jks for release signing
          KEY_B64="${{ secrets.KEYSTORE_BASE64 }}"
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > my-upload-key.jks
          else
            if [ ! -f my-upload-key.jks ]; then
              keytool -genkeypair -v -keystore my-upload-key.jks -alias upload \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$STORE_PWD" -keypass "$KEY_PWD" \
                -dname "CN=AnkiFlashcards, OU=App, O=AIStudio, C=MM"
            fi
          fi
          cp my-upload-key.jks app/my-upload-key.jks 2>/dev/null || true

          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PWD" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PWD" >> $GITHUB_ENV

      - name: Build Android APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "Building Release APK..."
          bash ./gradlew assembleRelease --no-daemon --stacktrace || echo "Release build encountered issues, proceeding to assembleDebug..."

          echo "Building Debug APK (guaranteed installable)..."
          bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect Generated APKs
        run: |
          mkdir -p release-apks
          echo "Locating built APKs..."
          find app/build/outputs/apk -type f -name "*.apk"

          REL_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" 2>/dev/null | head -n 1)
          DBG_APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" 2>/dev/null | head -n 1)

          if [ -n "$REL_APK" ] && [ -f "$REL_APK" ]; then
            cp "$REL_APK" "release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}.apk"
            cp "$REL_APK" "release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}-release.apk"
            echo "Prepared Release APK from: $REL_APK"
          fi

          if [ -n "$DBG_APK" ] && [ -f "$DBG_APK" ]; then
            cp "$DBG_APK" "release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}-debug.apk"
            echo "Prepared Debug APK from: $DBG_APK"
            if [ ! -f "release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}.apk" ]; then
              cp "$DBG_APK" "release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}.apk"
              echo "Promoted debug APK as main APK"
            fi
          fi

          echo "Generated APK files in release-apks:"
          ls -lh release-apks/

          if [ ! -f "release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}.apk" ]; then
            echo "::error ::No APK was built!"
            exit 1
          fi

      - name: Upload APKs as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnkiFlashcards-${{ env.RELEASE_TAG }}
          path: release-apks/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.RELEASE_TAG }}
        run: |
          echo "Publishing GitHub Release for tag: $TAG_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Attempt tag push if not existing
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating tag $TAG_NAME locally..."
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME" 2>/dev/null || echo "Tag push skipped or already exists on remote."
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Uploading APK files..."
            gh release upload "$TAG_NAME" release-apks/*.apk --clobber || true
          else
            echo "Creating new GitHub Release $TAG_NAME..."
            gh release create "$TAG_NAME" release-apks/*.apk \
              --target "${{ github.sha }}" \
              --title "Release $TAG_NAME" \
              --notes "Automated APK Release for **Anki Flashcards** ($TAG_NAME)" \
              --generate-notes \
              --latest || echo "gh release create returned an error. Moving to fallback."
          fi

      - name: Fallback Release (Action-GH-Release)
        if: steps.create_release.outcome == 'failure' || steps.create_release.outcome == 'skipped'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.RELEASE_TAG }}
          files: release-apks/*.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build Summary
        if: always()
        run: |
          echo "=========================================="
          echo "APK BUILD & RELEASE PROCESS COMPLETED!"
          echo "Version Tag: ${{ env.RELEASE_TAG }}"
          echo "=========================================="
          if [ -d release-apks ] && [ "$(ls -A release-apks)" ]; then
            echo "Generated APK files:"
            ls -lh release-apks/
            echo "Status: SUCCESS - APK files are ready!"
            echo "Artifacts are accessible in the GitHub Actions run 'Artifacts' section."
          else
            echo "Status: WARNING - Check previous build steps for APK generation status."
          fi
