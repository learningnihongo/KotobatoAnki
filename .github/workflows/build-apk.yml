name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom Release Tag (leave empty for auto-increment)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Version
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
            if [ -z "$VERSION_NAME" ]; then
              VERSION_NAME="1.0"
            fi
            TAG="v${VERSION_NAME}.${{ github.run_number }}"
          fi

          echo "Determined Release Version: $TAG"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # AGP 9.1.1 and compileSdk 36 strictly require JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Setup Environment File
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          touch .env

      - name: Setup Keystores (Release and Debug)
        run: |
          STORE_PASS="${{ secrets.STORE_PASSWORD }}"
          if [ -z "$STORE_PASS" ]; then
            STORE_PASS="android"
          fi

          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          if [ -z "$KEY_PASS" ]; then
            KEY_PASS="android"
          fi

          KEY_BASE64="${{ secrets.KEYSTORE_BASE64 }}"
          if [ -n "$KEY_BASE64" ]; then
            echo "Decoding provided release keystore from secrets..."
            echo "$KEY_BASE64" | base64 -d > my-upload-key.jks
          else
            echo "Generating build keystore..."
            keytool -genkey -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=AnkiFlashcards, OU=App, O=AIStudio, C=MM"
          fi

          # Copy to app directory so both relative and absolute paths resolve
          cp my-upload-key.jks app/my-upload-key.jks

          # Decode debug.keystore from base64 if present
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            cp debug.keystore app/debug.keystore 2>/dev/null || true
          fi

          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

      - name: Build Android APKs
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace --no-daemon

      - name: Prepare APKs for Release
        run: |
          mkdir -p release-apks

          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk"

          REL_APK=$(find app/build/outputs/apk/release -type f -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$REL_APK" ]; then
            REL_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" 2>/dev/null | head -n 1)
          fi

          DBG_APK=$(find app/build/outputs/apk/debug -type f -name "*debug*.apk" 2>/dev/null | head -n 1)
          if [ -z "$DBG_APK" ]; then
            DBG_APK=$(find app/build/outputs/apk -type f -name "*debug*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -f "$REL_APK" ]; then
            cp "$REL_APK" "release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}.apk"
            echo "Copied release APK to: release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}.apk"
          fi

          if [ -f "$DBG_APK" ]; then
            cp "$DBG_APK" "release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}-debug.apk"
            echo "Copied debug APK to: release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}-debug.apk"
          fi

          APK_COUNT=$(find release-apks -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK was produced by Gradle build."
            exit 1
          fi

          ls -lh release-apks/

      # Artifact upload always succeeds and lets users download the APK immediately
      - name: Upload APKs to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnkiFlashcards-${{ env.RELEASE_TAG }}-APKs
          path: release-apks/*.apk
          retention-days: 30

      # Create GitHub Release with APK attached
      - name: Create or Update GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: release-apks/*.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Release Status & Help
        if: steps.create_release.outcome == 'failure'
        run: |
          echo "::warning::GitHub Release creation failed. This is usually due to GitHub Actions Workflow Permissions."
          echo "::warning::To enable: Go to Repository Settings -> Actions -> General -> Workflow permissions -> Select 'Read and write permissions' and Save."
          echo "::notice::Your APK was successfully built and is available in the 'Artifacts' section of this workflow run!"
