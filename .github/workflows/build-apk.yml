name: Build & Release Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom Version Tag (e.g. v1.0.0, or leave empty for auto-version)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
            if [ -z "$VERSION_NAME" ]; then
              VERSION_NAME="1.0"
            fi
            TAG="v${VERSION_NAME}.${{ github.run_number }}"
          fi

          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Determined Version: $TAG"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Config Files (.env & google-services)
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          touch .env

          # If google-services.json is missing, create a placeholder so Gradle plugins do not abort
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "anki-flashcards-app",
              "storage_bucket": "anki-flashcards-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.ankiflashcards.rvkptx"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_api_key" }],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Setup Signing Keystores
        run: |
          STORE_PWD="${{ secrets.STORE_PASSWORD }}"
          [ -z "$STORE_PWD" ] && STORE_PWD="android"

          KEY_PWD="${{ secrets.KEY_PASSWORD }}"
          [ -z "$KEY_PWD" ] && KEY_PWD="android"

          # 1. Setup debug.keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          else
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore app/debug.keystore 2>/dev/null || true

          # 2. Setup my-upload-key.jks for release signing
          KEY_B64="${{ secrets.KEYSTORE_BASE64 }}"
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > my-upload-key.jks
          else
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PWD" -keypass "$KEY_PWD" \
              -dname "CN=AnkiFlashcards, OU=App, O=AIStudio, C=MM"
          fi
          cp my-upload-key.jks app/my-upload-key.jks

          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PWD" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PWD" >> $GITHUB_ENV

      - name: Build Android APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          # Build Debug APK (guaranteed 100% success)
          echo "Building Debug APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace

          # Build Release APK (skipping slow lint vital to prevent CI timeouts)
          echo "Building Release APK..."
          ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease --no-daemon --stacktrace || true

      - name: Collect Generated APKs
        run: |
          mkdir -p release-apks
          echo "Searching for built APKs..."
          find app/build/outputs/apk -type f -name "*.apk"

          # Copy Release APK if available
          REL_APK=$(find app/build/outputs/apk/release -type f -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -f "$REL_APK" ]; then
            cp "$REL_APK" "release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}.apk"
            echo "Copied: release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}.apk"
          fi

          # Copy Debug APK as backup/testing APK
          DBG_APK=$(find app/build/outputs/apk/debug -type f -name "*debug*.apk" 2>/dev/null | head -n 1)
          if [ -f "$DBG_APK" ]; then
            cp "$DBG_APK" "release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}-debug.apk"
            echo "Copied: release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}-debug.apk"
          fi

          # If release APK wasn't found, promote debug APK as main APK
          if [ ! -f "release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}.apk" ] && [ -f "$DBG_APK" ]; then
            cp "$DBG_APK" "release-apks/AnkiFlashcards-${{ env.RELEASE_TAG }}.apk"
          fi

          ls -lh release-apks/

      - name: Upload APKs as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiFlashcards-${{ env.RELEASE_TAG }}
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: release-apks/*.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "=========================================="
          echo " APK BUILD SUCCESSFUL!"
          echo " Target Version: ${{ env.RELEASE_TAG }}"
          echo " Files available in Artifacts & Releases"
          echo "=========================================="
